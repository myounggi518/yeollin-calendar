<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>재고 부족 알림</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#15243b;-webkit-text-size-adjust:100%}
body{margin:0;padding:8px;background:transparent}
.box{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{font:inherit;font-size:16px;border-radius:10px;min-height:44px}
select{flex:1 1 120px;padding:0 10px;border:1px solid #cfd8e3;background:#fff;color:#15243b}
button{flex:2 1 200px;border:0;background:#e5484d;color:#fff;font-weight:700;padding:0 14px;cursor:pointer}
button:disabled{opacity:.55}
#msg{width:100%;font-size:14px;min-height:18px;color:#5b6b80}
#msg.ok{color:#1f8a4c}#msg.err{color:#c62f34}
</style>
</head>
<body>
<div class="box">
  <select id="who" aria-label="보내는 사람"><option value="">보내는 사람</option></select>
  <button id="go" disabled>📣 재고 부족 알림 보내기</button>
  <div id="msg"></div>
</div>
<script>
const page = new URLSearchParams(location.search).get('page') || '';
const $ = (id) => document.getElementById(id);
const say = (t, c) => { $('msg').textContent = t; $('msg').className = c || ''; };
let label = '';
const KEY = 'alertName';
async function init() {
  try {
    const r = await fetch('/api/alert?page=' + encodeURIComponent(page));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '불러오기 실패');
    label = d.label;
    for (const n of d.authors) { const o = document.createElement('option'); o.value = o.textContent = n; $('who').appendChild(o); }
    try { const s = localStorage.getItem(KEY); if (s && d.authors.includes(s)) $('who').value = s; } catch (e) {}
    $('go').disabled = false;
    say(d.access ? '누르면 직원 모두에게 노션 알림이 갑니다.' : '⚠️ 이 페이지에 「열린기획 알림」 연결이 필요해요. 관리자에게 알려 주세요.', d.access ? '' : 'err');
  } catch (e) { say(e.message, 'err'); }
}
$('go').addEventListener('click', async () => {
  const name = $('who').value;
  if (!name) { say('보내는 사람을 먼저 골라 주세요.', 'err'); $('who').focus(); return; }
  try { localStorage.setItem(KEY, name); } catch (e) {}
  $('go').disabled = true; say('보내는 중…');
  try {
    const r = await fetch('/api/alert?page=' + encodeURIComponent(page), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || '보내지 못했어요');
    say(`✅ ${label} 재고 부족 알림을 보냈어요.`, 'ok');
  } catch (e) { say(e.message, 'err'); }
  setTimeout(() => { $('go').disabled = false; }, 3000);
});
init();
</script>
</body>
</html>
