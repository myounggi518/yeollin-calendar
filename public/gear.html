<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>음향장비 반출목록</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#15243b;background:#f4f7fb;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;padding:12px 12px 40px}
h1{font-size:clamp(18px,4vw,24px);margin:0}
button,select,input{font:inherit;color:inherit}
button{background:#fff;border:1px solid #ccd5e0;border-radius:8px;padding:7px 11px;cursor:pointer;touch-action:manipulation}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
#event{flex:1 1 200px;min-width:0;padding:8px;border:1px solid #ccd5e0;border-radius:8px;background:#fff;font-weight:700}
#status{font-size:12px;color:#5e6a7e;min-height:18px;margin:2px 0 8px}
#status.err{color:#b42318;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.blk{background:#fff;border:1.5px solid #9aa7b8;border-radius:8px;overflow:hidden}
.blk h2{margin:0;font-size:14px;padding:7px 9px;background:#e8edf4;border-bottom:1px solid #9aa7b8;display:flex;justify-content:space-between;align-items:center;gap:6px}
.blk h2 small{font-weight:600;color:#5e6a7e;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th{font-size:11px;color:#5e6a7e;font-weight:600;padding:4px 5px;border-bottom:1px solid #dfe5ec;text-align:left}
td{padding:3px 5px;border-bottom:1px solid #eef1f5;vertical-align:middle}
th.q,td.q{width:58px;text-align:center}
th.c,td.c{width:40px;text-align:center}
th.n,td.n{width:28%}
td.name{word-break:keep-all;overflow-wrap:break-word;font-weight:600}
.stk .nw{white-space:nowrap}
input.qty{width:100%;text-align:center;padding:5px 2px;border:1px solid #e3c96a;border-radius:6px;background:#fff8d6;font-weight:700}
input.qty.has{background:#ffe680;border-color:#c9a400}
input.note,input.kind{width:100%;padding:5px;border:1px solid #dfe5ec;border-radius:6px;background:#fff;font-size:12px}
input.kind{font-weight:600;font-size:13px}
input[type=checkbox]{width:20px;height:20px;accent-color:#1f7a3d}
tr.saving td{opacity:.55}
tr.failed td{background:#fde2e1}
tr.zero td.name{color:#8a95a5;font-weight:500}
.add{width:100%;border:0;border-top:1px dashed #ccd5e0;border-radius:0;color:#2156a5;font-weight:700;background:#fafcff}
.sum{font-size:12px;color:#5e6a7e;margin-left:auto}
/* 재고 제한: 품목 이름 아래 「남음 / 보유」, 넘으면 빨간 경고 줄 */
.stk{display:block;font-size:11px;font-weight:600;color:#5e6a7e;margin-top:2px;line-height:1.25}
.stk[hidden]{display:none}
.stk.low{color:#b54708}
.stk.none{color:#b42318}
tr.warn td{background:#fde2e1;color:#b42318;font-size:12px;font-weight:700;padding:7px 8px;line-height:1.4;white-space:pre-line;border-bottom:1px solid #f0b4ae}
.empty{display:none}
/* 휴대폰: 입력칸 글자 16px(아이폰 확대 방지), 위쪽 고정 막대, 칸 접기 */
.top.bar{position:sticky;top:0;z-index:5;background:#f4f7fb;padding:6px 0}
#ttl{flex:1 0 100%}
#evname{flex:1 1 150px;min-width:0;font-size:16px;line-height:1.3}
#evname[hidden],#ttl[hidden]{display:none}
.bar .sum{margin-left:0;white-space:nowrap}
.blk h2{cursor:pointer;user-select:none}
.blk h2 .cnt{margin-left:auto;font-size:12px;color:#1f7a3d;font-weight:700}
.blk h2 .arr{font-size:11px;color:#5e6a7e;transition:transform .15s}
.blk.fold h2 .arr{transform:rotate(-90deg)}
.blk.fold table,.blk.fold .add{display:none}
@media (max-width:640px){
  body{padding:8px 8px 60px}
  input.qty,input.note,input.kind,#event{font-size:16px}
  input.qty{padding:8px 2px}
  input[type=checkbox]{width:26px;height:26px}
  th.q,td.q{width:64px} th.c,td.c{width:44px} th.n,td.n{width:30%}
  td{padding:4px}
  .blk h2{font-size:15px;padding:11px 10px}
  .add{padding:12px}
  button{padding:9px 12px}
  .bar button{padding:7px 9px;font-size:14px}
  #evname{font-size:15px}
}
/* LED처럼 EA·BOX 두 칸인 칸: 이름칸을 넓게 */
.blk.box th.n,.blk.box td.n{width:18%}
.blk.box th.q,.blk.box td.q{width:52px}
/* 영상: 스크린 사이즈 1~4번 */
.scr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:2px 0 6px}
.scr[hidden]{display:none}
.scr label{display:flex;align-items:center;gap:4px;background:#fff;border:1.5px solid #9aa7b8;border-radius:8px;padding:4px 6px;font-size:12px;font-weight:700;color:#5e6a7e;white-space:nowrap}
.scr input{flex:1;min-width:0;border:0;padding:4px 2px;font-size:14px;font-weight:700;background:transparent}
.scr .saving{opacity:.55} .scr .failed{background:#fde2e1}
/* 영상: 영상담당자 (선택형) */
.vstaff{display:flex;align-items:center;gap:8px;margin:2px 0 6px;background:#fff;border:1.5px solid #9aa7b8;border-radius:8px;padding:4px 8px}
.vstaff[hidden]{display:none}
.vstaff b{font-size:12px;color:#5e6a7e;white-space:nowrap}
.vstaff select{flex:1;min-width:0;border:0;padding:6px 2px;font-size:15px;font-weight:700;background:transparent;color:#15243b}
.vstaff.saving{opacity:.6} .vstaff.failed{background:#fde2e1}
@media (max-width:640px){.vstaff select{font-size:16px}}
@media (max-width:640px){.scr{grid-template-columns:repeat(2,minmax(0,1fr))}.scr input{font-size:16px}}
/* 다른 일정 불러오기 */
.copy{margin:2px 0 8px;background:#fff;border:1.5px solid #2156a5;border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.copy[hidden]{display:none}
.copy b{flex:1 0 100%;font-size:14px;color:#2156a5}
.copy input.q[hidden]{display:none}
.copy input.q{flex:1 0 100%;min-width:0;padding:9px;border:1px solid #ccd5e0;border-radius:8px;background:#fff;font-size:16px}
.copy select{flex:1 1 200px;min-width:0;padding:9px;border:1px solid #ccd5e0;border-radius:8px;background:#fff;font-size:16px}
.copy .go{flex:1 1 120px;background:#2156a5;border-color:#2156a5;color:#fff;font-weight:700;padding:11px}
.copy .go:disabled{opacity:.5}
.copy small{flex:1 0 100%;font-size:12px;color:#5e6a7e;white-space:pre-line}
.copy small.ok{color:#1f7a3d;font-weight:700}
.copy small.err{color:#b42318;font-weight:700}
#copyBtn[hidden]{display:none}
/* 크게 보기: 노션 임베드 안에서만 보임, 누르면 전체 화면으로 열림 */
.bigbtn{display:inline-block;background:#15243b;color:#fff;border:1px solid #15243b;border-radius:8px;padding:7px 11px;font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}
.bigbtn[hidden]{display:none}
/* 복사 · 붙여넣기 */
.clipbtn{color:#7a4b00;border-color:#e3c96a;background:#fff8d6;font-weight:700}
.clipbtn.paste{color:#fff;background:#c97a00;border-color:#c97a00;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clipbtn[hidden]{display:none}
/* 작성 완료 알림 */
.notify{margin:14px 0 4px;background:#fff;border:1.5px solid #1f7a3d;border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.notify b{flex:1 0 100%;font-size:14px;color:#1f7a3d}
.notify select{flex:1 1 140px;min-width:0;padding:9px;border:1px solid #ccd5e0;border-radius:8px;background:#fff;font-size:16px}
.notify button{flex:1 1 180px;background:#1f7a3d;border-color:#1f7a3d;color:#fff;font-weight:700;padding:11px}
.notify button.armed{background:#c9a400;border-color:#c9a400}
.notify small{flex:1 0 100%;font-size:12px;color:#5e6a7e}
@media print{
  .blk.fold table{display:table!important}
  body{background:#fff;padding:0}
  .noprint,.add,#status{display:none!important}
  .grid{grid-template-columns:repeat(4,1fr);gap:6px}
  .blk{break-inside:avoid;border-width:1px}
  tr.zero{display:none}
  input{border:0!important;background:none!important;padding:0!important}
  .blk.empty-print{display:none}
}
</style>
</head>
<body>
<div class="top bar">
  <h1 id="ttl">📦 음향장비 반출목록</h1>
  <select id="event" aria-label="일정 선택"><option>불러오는 중…</option></select>
  <b id="evname" hidden></b>
  <span class="sum" id="sum"></span>
  <a id="bigBtn" class="noprint bigbtn" hidden target="_blank" rel="noopener">⤢ 크게 보기</a>
  <button id="clipCopy" class="noprint clipbtn" hidden>📄 복사</button>
  <button id="clipPaste" class="noprint clipbtn paste" hidden>📥 붙여넣기</button>
  <button id="copyBtn" class="noprint" hidden style="color:#2156a5;border-color:#9db8e3">📋 불러오기</button>
  <button id="reload" class="noprint" title="다른 사람이 바꾼 내용 다시 불러오기">새로고침</button>
  <button id="print" class="noprint">인쇄</button>
  <button id="reset" class="noprint" style="color:#b42318;border-color:#f0b4ae">초기화</button>
</div>
<div class="copy noprint" id="copy" hidden>
  <b>📋 다른 일정의 반출목록 불러오기</b>
  <input id="copyQ" class="q" type="search" placeholder="🔍 행사명 검색 (예: 꼬막) — 비우면 최근 10개" aria-label="행사명 검색" autocomplete="off">
  <select id="copySrc" aria-label="불러올 일정"><option value="">불러오는 중…</option></select>
  <button class="go" id="copyGo">불러오기</button>
  <button id="copyClose">닫기</button>
  <small id="copyMsg">이미 적힌 품목은 그대로 두고, 없는 품목만 추가합니다. 챙김은 빈칸으로 가져옵니다.</small>
</div>
<div id="vstaff" class="vstaff" hidden></div>
<div id="scr" class="scr" hidden></div>
<div id="status"></div>
<div class="grid" id="grid"></div>
<div class="notify noprint" id="notify" hidden>
  <b>✅ 다 적었으면 직원 모두에게 알려 주세요</b>
  <select id="who" aria-label="작성자"><option value="">작성자 선택</option></select>
  <button id="send">작성 완료 · 전체 알림</button>
  <small id="nmsg">누르면 이 일정 페이지에 댓글이 달리고, 직원들 노션 앱으로 알림이 갑니다.</small>
</div>
<datalist id="dl"></datalist>

    function paint() { qty.classList.toggle('has', r.qty > 0); if (boxIn) boxIn.classList.toggle('has', r.box > 0); tr.classList.toggle('zero', !has(r)); }
    paint(); paintHint();
    return tr;
  }

  function fillList(b) {
    const dl = $('dl'); dl.textContent = '';
    let list = catalog.filter((g) => b.cats.includes(g.cat) && !(b.skip || []).includes(g.name));
    if (b.order) list = list.map((g, i) => [g, i]).sort((x, y) => (b.order(x[0]) - b.order(y[0])) || (x[1] - y[1])).map((x) => x[0]);
    for (const g of list) {
      const o = new Option(g.name);
      const a = availFor({ gear: g.id, qty: 0 });
      if (a) o.label = a.stock === 1 && a.other > 0 ? '⛔ 사용 중' : `남음 ${a.avail} / 보유 ${a.stock}`;
      dl.append(o);
    }
  }

  // 영상: 행사명 아래 스크린 사이즈 1~4번 (노션에는 [vscr] 1~4 줄의 NOTE로 저장)
  function renderScreens() {
    const box = $('scr'); box.textContent = '';
    box.hidden = !VIDEO || !eventId;
    if (box.hidden) return;
    for (const n of ['1', '2', '3', '4']) {
      let r = rows.find((x) => !x.gear && x.block === 'vscr' && x.text === n);
      if (!r) { r = { key: ++seq, gear: null, block: 'vscr', text: n, qty: 0, checked: false, note: '' }; rows.push(r); }
      const lab = el('label'); lab.append(n + '번 스크린');
      const inp = el('input'); inp.value = r.note || ''; inp.placeholder = '사이즈';
      inp.addEventListener('input', () => { r.note = inp.value; queueSave(r, lab); });
      lab.append(inp); box.append(lab);
    }
  }

  // 영상: 영상담당자 선택칸 (노션에는 [vstaff] 담당자 줄의 NOTE에 이름으로 저장)
  const V_STAFF = ['안준용', '정덕수', '김상연', '이영범'];
  function renderStaff() {
    const box = $('vstaff'); box.textContent = '';
    box.hidden = !VIDEO || !eventId;
    if (box.hidden) return;
    let r = rows.find((x) => !x.gear && x.block === 'vstaff');
    if (!r) { r = { key: ++seq, gear: null, block: 'vstaff', text: '담당자', qty: 0, checked: false, note: '' }; rows.push(r); }
    box.append(el('b', null, '🎬 영상담당자'));
    const sel = el('select'); sel.setAttribute('aria-label', '영상담당자');
    sel.append(new Option('— 선택 —', ''));
    const cur = (r.note || '').trim();
    for (const n of V_STAFF) sel.append(new Option(n, n));
    if (cur && !V_STAFF.includes(cur)) sel.append(new Option(cur, cur));   // 예전에 여러 명 저장된 값도 그대로 보이게
    sel.value = cur;
    sel.addEventListener('change', () => { r.note = sel.value; queueSave(r, box); });
    box.append(sel);
  }

  function render() {
    hints = [];
    renderStaff();
    renderScreens();
    const grid = $('grid'); grid.textContent = '';
    for (const col of LAYOUT) {
      const c = el('div', 'col');
      for (const b of col) {
        const box = el('section', 'blk');
        const h = el('h2'); h.append(el('span', null, b.t), el('span', 'cnt'), el('span', 'arr', '▼')); box.append(h);
        h.addEventListener('click', () => { box.classList.toggle('fold'); folded[b.k] = box.classList.contains('fold'); });
        box.dataset.k = b.k; if (b.box) box.classList.add('box');
        const tbl = el('table');
        const hr = el('tr'); (b.box ? [['종류', ''], ['EA', 'q'], ['BOX', 'q'], ['챙김', 'c'], ['NOTE', 'n']] : [['종류', ''], ['수량', 'q'], ['챙김', 'c'], ['NOTE', 'n']]).forEach(([t, k]) => hr.append(el('th', k, t)));
        const thead = el('thead'); thead.append(hr);
        const tb = el('tbody'); tbl.append(thead, tb); box.append(tbl);
        let mine = rows.filter((r) => blockOfRow(r) === b);
        if (b.fixed) {
          let list = catalog.filter((g) => b.cats.includes(g.cat) && !(b.skip || []).includes(g.name));
          if (b.order) list = list.map((g, i) => [g, i]).sort((x, y) => (b.order(x[0]) - b.order(y[0])) || (x[1] - y[1])).map((x) => x[0]);
          for (const g of list) {
            let r = mine.find((x) => x.gear === g.id);
            if (!r) { r = { key: ++seq, gear: g.id, qty: 0, checked: false, note: '' }; rows.push(r); }
            tb.append(rowEl(r, b, true));
          }
          for (const r of mine.filter((x) => !list.some((g) => g.id === x.gear))) tb.append(rowEl(r, b, false));
        }
        if (!b.fixed) for (const r of mine) tb.append(rowEl(r, b, false));
        if (!b.fixed || b.add) {
          const add = el('button', 'add', '+ 추가');
          add.disabled = !eventId;
          add.addEventListener('click', () => {
            const r = { key: ++seq, gear: null, block: b.k, text: '', qty: 0, checked: false, note: '' }; rows.push(r);
            const tr = rowEl(r, b, false); tb.append(tr); tr.querySelector('input').focus();
          });
          box.append(add);
        }
        if (!eventId) box.querySelectorAll('input').forEach((i) => { i.disabled = true; });
        // 휴대폰에서는 아직 넣은 게 없는 고정 칸(XLR·전원선 등 긴 목록)을 접어 둠. 머리글을 누르면 펼침
        const fold = b.k in folded ? folded[b.k] : b.k !== OPEN;   // 처음엔 첫 칸(음향: MAIN SPEAKER + AMP, 영상: LED)만 펼침
        box.classList.toggle('fold', !!fold);
        c.append(box);
      }
      grid.append(c);
    }
    updateSum();
  }

  function updateSum() {
    const used = rows.filter((r) => has(r) && blockOfRow(r));   // 이 화면(음향/영상) 칸에 속한 줄만
    document.querySelectorAll('.blk').forEach((box) => {
      const b = BLOCKS.find((x) => x.k === box.dataset.k);
      const n = used.filter((r) => blockOfRow(r) === b).length;
      box.querySelector('.cnt').textContent = n ? n + '종' : '';
    });
    const done = used.filter((r) => r.checked).length;
    $('sum').textContent = eventId && used.length ? `챙김 ${done} / ${used.length}종` : '';
    const ev = events.find((e) => e.id === eventId);
    document.title = ev ? `${TITLE} · ${ev.title}` : TITLE;
  }

  // ── 다른 일정에서 불러오기 (합치기: 이미 있는 품목은 그대로, 없는 품목만 추가) ──
  setInterval(() => { $('copyBtn').hidden = !copyOn || !eventId; if (!eventId) $('copy').hidden = true; }, 500);
  const copyMsg = (t, cls) => { const m = $('copyMsg'); m.textContent = t; m.className = cls || ''; };
  const fmtFull = (s) => { const [y, m, d] = s.split('-').map(Number); const w = '일월화수목금토'[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; return `${y}/${m}/${d}(${w})`; };
  let srcSeq = 0, srcTimer = null;
  async function loadSources(q) {
    const my = ++srcSeq, sel = $('copySrc');
    sel.textContent = ''; sel.append(new Option(q ? `「${q}」 찾는 중…` : '불러오는 중…', ''));
    try {
      const d = await api('/api/gear/sources?screen=' + encodeURIComponent(SCREEN) + (csearchOn ? '&q=' + encodeURIComponent(q) : ''));
      if (my !== srcSeq) return;
      const list = d.events.filter((e) => e.id !== eventId);
      sel.textContent = '';
      if (!list.length) { sel.append(new Option(q ? `「${q}」 반출목록이 있는 일정이 없습니다` : '반출목록이 적힌 다른 일정이 없습니다', '')); return; }
      sel.append(new Option(!csearchOn ? '— 불러올 일정을 고르세요 —' : q ? `— 검색 결과 ${list.length}개 —` : '— 최근 일정 (검색하면 지난 일정도 찾아요) —', ''));
      for (const e of list) sel.append(new Option(`${e.date ? fmtFull(e.date) + ' ' : ''}${e.title} · ${e.count}종`, e.id));
    } catch (e) { if (my === srcSeq) copyMsg('일정 목록을 못 불러왔습니다: ' + e.message, 'err'); }
  }
  $('copyQ').addEventListener('input', () => { clearTimeout(srcTimer); srcTimer = setTimeout(() => loadSources($('copyQ').value.trim()), 350); });
  $('copyBtn').addEventListener('click', async () => {
    const box = $('copy');
    if (!box.hidden) { box.hidden = true; return; }
    box.hidden = false; copyMsg('지금 목록을 모두 지우고 고른 일정의 목록으로 바꿉니다. 챙김은 빈칸으로 가져옵니다.');
    $('copyQ').value = '';
    loadSources('');
  });
  $('copyClose').addEventListener('click', () => { $('copy').hidden = true; });
  // 기존 목록이 있으면 한 번 더 눌러야 실행 (노션 앱 안에서는 확인 창이 막힐 수 있어 버튼으로 확인)
  const existingCount = () => rows.filter((x) => blockOfRow(x) && (has(x) || (x.note || '').trim())).length;
  const armed = new Map();
  function needArm(btn, label) {
    const n = existingCount();
    if (!n || armed.has(btn)) { if (armed.has(btn)) { clearTimeout(armed.get(btn).t); btn.textContent = armed.get(btn).label; btn.style.background = ''; armed.delete(btn); } return false; }
    const old = btn.textContent;
    btn.textContent = label(n); btn.style.background = '#fde2e1';
    armed.set(btn, { label: old, t: setTimeout(() => { btn.textContent = old; btn.style.background = ''; armed.delete(btn); }, 4000) });
    return true;
  }
  $('copyGo').addEventListener('click', async () => {
    const src = $('copySrc').value, id = eventId, btn = $('copyGo');
    if (!src || !id) { copyMsg('먼저 불러올 일정을 고르세요.', 'err'); return; }
    const srcName = $('copySrc').selectedOptions[0].textContent.replace(/ · \d+종$/, '');
    btn.disabled = true;
    try { await mergeFrom(src, srcName, copyMsg); } finally { btn.disabled = false; }
  });

  // 다른 일정(src)의 반출목록을 지금 일정에 합쳐 넣기 — 불러오기·붙여넣기 공용
  async function mergeFrom(src, srcName, say) {
    const id = eventId;
    say('불러오는 중…');
    try {
      await Promise.all([...chains.values()]);
      const [d] = await Promise.all([api('/api/gear?event=' + src), loadStock(id)]);
      if (eventId !== id) return;
      // 통째로 바꾸기: 이 화면(음향/영상)의 기존 줄은 모두 비우고 복사한 목록으로 채움 (노션의 기존 줄은 서버가 지움)
      for (const t of timers.values()) clearTimeout(t);
      timers.clear();
      const removed = rows.filter((x) => blockOfRow(x) && (has(x) || (x.note || '').trim())).length;
      rows = rows.filter((x) => !blockOfRow(x));
      let added = 0; const cut = [], todo = [];
      for (const s of d.rows) {
        if (!blockOfRow(s) || !(has(s) || (s.note || '').trim())) continue;
        if (!s.gear && (s.block === 'vscr' || s.block === 'vstaff')) continue;
        const r = { key: ++seq, gear: s.gear || null, block: s.block, text: s.text, qty: 0, box: 0, checked: false, note: '' }; rows.push(r);
        r.qty = s.qty || 0; r.box = s.box || 0; r.note = s.note || ''; r.checked = false;
        // 재고가 모자라면 수량을 줄이지 않고 그 품목은 빼고 알려 줌 (사용자가 고른 수량이 아니므로)
        const a = availFor(r), nm = byId[r.gear] ? byId[r.gear].name : '';
        let over = '';
        if (a && r.qty > a.avail) over = `${nm} ${a.boxStock != null ? '판 ' : ''}${r.qty}개(남은 재고 ${a.avail})`;
        else if (a && a.boxStock != null && r.box > a.boxAvail) over = `${nm} 박스 ${r.box}개(남은 재고 ${a.boxAvail})`;
        if (over) { cut.push(over); rows.splice(rows.indexOf(r), 1); continue; }
        if (!has(r) && !r.note.trim()) { rows.splice(rows.indexOf(r), 1); continue; }
        todo.push(r); added++;
      }
      render();   // 화면은 바로 채우고, 저장은 한 번에 (서버가 재고 확인 1번 + 3줄씩 동시에 저장)
      let failed = 0, dropped = 0;
      {
        say(`노션에 저장하는 중… (${todo.length}종)`);
        const resp = await api('/api/gear/bulk?event=' + id, { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ screen: SCREEN, replace: true, stock: stockOn || undefined, rows: todo.map((r) => ({ gear: r.gear || undefined, block: r.block, text: r.text, qty: r.qty, box: r.box || 0, checked: false, note: r.note })) }) });
        if (eventId !== id) return;
        (resp.results || []).forEach((x, i) => {
          const r = todo[i];
          if (x && x.ok && x.row) { r.pid = x.row.pid; r.screen = SCREEN; r.qty = x.row.qty; r.box = x.row.box; r.saved = r.qty; r.savedBox = r.box; }
          else if (x && x.ok) { if (x.skipped) dropped++; const k = rows.indexOf(r); if (k >= 0) rows.splice(k, 1); }
          else { failed++; }
        });
        for (const c of resp.cut || []) {   // 그사이 다른 일정이 먼저 잡아 서버가 뺀 품목
          const nm = byId[c.gear] ? byId[c.gear].name : '';
          cut.push(`${nm} ${c.kind === 'box' ? '박스 ' : ''}${c.from}개(남은 재고 ${c.to})`);
        }
        render(); await loadStock(id); hints.forEach((f) => f());
      }
      let t = `✅ ${srcName}에서 ${added - failed - dropped}종 불러옴`;
      if (failed) t += ` · ${failed}종 저장 실패(다시 불러오면 재시도)`;
      if (removed) t += ` · 기존 ${removed}종은 지움`;
      if (cut.length) t += `\n⚠️ 재고가 모자라 빠진 품목: ${cut.join(', ')} — 재고현황의 숫자를 넘어서면 선택할 수 없습니다`;
      status(t.split('\n')[0], !!cut.length);
      say(t, cut.length ? 'err' : 'ok');
    } catch (e) { say('불러오기 실패: ' + e.message, 'err'); }
  }

  // ── 📄 복사 · 📥 붙여넣기: 복사한 일정은 이 기기에 기억 (음향·영상 따로, 3일) ──
  const CLIP_KEY = 'gearClip:' + SCREEN;
  let clipMem = null;
  const clipGet = () => {
    let c = clipMem;
    try { const v = localStorage.getItem(CLIP_KEY); if (v) c = JSON.parse(v); } catch (e) {}
    if (c && Date.now() - (c.at || 0) > 3 * 24 * 3600 * 1000) c = null;
    return c;
  };
  const clipSet = (c) => { clipMem = c; try { localStorage.setItem(CLIP_KEY, JSON.stringify(c)); } catch (e) {} };
  const clipLabel = (c) => { const [, m, d] = (c.date || '').split('-').map(Number); return `${m ? m + '/' + d + ' ' : ''}${c.title}`; };
  function paintClip() {
    const c = clipGet(), p = $('clipPaste');
    $('clipCopy').hidden = !clipOn || !eventId;
    p.hidden = !clipOn || !eventId || !c || c.id === eventId;
    if (!p.hidden && !armed.has(p)) p.textContent = `📥 붙여넣기 (${clipLabel(c).slice(0, 18)})`;
  }
  setInterval(paintClip, 700);
  $('clipCopy').addEventListener('click', () => {
    const n = rows.filter((x) => blockOfRow(x) && (has(x) || (x.note || '').trim())).length;
    if (!n) { status('복사할 반출목록이 없어요. 먼저 수량을 적어 주세요.', true); return; }
    const ev = events.find((e) => e.id === eventId) || {};
    clipSet({ id: eventId, title: ev.title || '', date: ev.startDate || '', count: n, at: Date.now() });
    const b = $('clipCopy'); b.textContent = '✅ 복사됨'; setTimeout(() => { b.textContent = '📄 복사'; }, 2000);
    status(`📄 ${clipLabel(clipGet() || { title: ev.title || '' })} 반출목록 ${n}종을 복사했어요. 세팅 일정에서 「📥 붙여넣기」를 누르세요.`);
    paintClip();
  });
  $('clipPaste').addEventListener('click', async () => {
    const c = clipGet(), b = $('clipPaste');
    if (!c || !eventId || c.id === eventId) return;
    b.disabled = true;
    try { await mergeFrom(c.id, clipLabel(c), (t, cls) => status(t.split('\n')[0] + (t.includes('\n') ? ' ' + t.split('\n')[1] : ''), cls === 'err')); }
    finally { b.disabled = false; }
  });

  $('event').addEventListener('change', (e) => openEvent(e.target.value));
  $('reload').addEventListener('click', () => eventId && openEvent(eventId));
  $('print').addEventListener('click', () => window.print());
  // 초기화: 한 번 누르면 확인 문구로 바뀌고, 3초 안에 한 번 더 눌러야 실행 (노션 앱 안에서는 확인 창이 막힐 수 있어 버튼으로 확인)
  const qp0 = new URLSearchParams(location.search);   // 테스트: &ntest=1 본인에게만 알림, &nhide=1 알림 뒤 멘션 지우기
  let resetArmed = null;
  $('reset').addEventListener('click', async () => {
    const btn = $('reset');
    if (!eventId) return;
    if (!resetArmed) {
      btn.textContent = '정말 지울까요? 한 번 더'; btn.style.background = '#fde2e1';
      resetArmed = setTimeout(() => { resetArmed = null; btn.textContent = '초기화'; btn.style.background = ''; }, 3000);
      return;
    }
    clearTimeout(resetArmed); resetArmed = null; btn.textContent = '초기화'; btn.style.background = ''; btn.disabled = true;
    // 화면은 바로 비우고, 노션 삭제는 뒤에서 진행
    for (const t of timers.values()) clearTimeout(t);
    timers.clear();
    const pending = [...chains.values()];
    const id = eventId;
    const pids = rows.filter((r) => r.pid && blockOfRow(r)).map((r) => r.pid);   // 이 화면 칸의 줄만 (음향↔영상 서로 안 지움)
    rows = []; render(); status('초기화했습니다 · 노션에서 지우는 중…');
    try {
      await Promise.all(pending);
      const d = await api('/api/gear/reset?event=' + id, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pids }) });
      if (eventId === id) status(`초기화 완료 (${d.removed}줄 · 노션 휴지통에서 되살릴 수 있음)`);
    } catch (e) { status('초기화 일부 실패: ' + e.message + ' (새로고침하면 남은 줄이 보입니다)', true); }
    finally { btn.disabled = false; }
  });
  // ── 작성 완료 알림 ──
  (async () => {
    try {
      const d = await api('/api/gear/staff');
      const who = $('who');
      for (const n of d.names) who.append(new Option(n, n));
      try { const saved = localStorage.getItem('gearWho'); if (saved && d.names.includes(saved)) who.value = saved; } catch {}
      who.addEventListener('change', () => { try { localStorage.setItem('gearWho', who.value); } catch {} });
    } catch {}
  })();
  const showNotify = () => { $('notify').hidden = !eventId; };
  setInterval(showNotify, 1000);
  let sendArmed = null;
  $('send').addEventListener('click', async () => {
    const btn = $('send'), msg = $('nmsg');
    if (!eventId) return;
    if (!$('who').value) { msg.textContent = '먼저 작성자를 고르세요.'; $('who').focus(); return; }
    if (!sendArmed) {   // 두 번 눌러야 보냄 (실수로 전 직원에게 알림이 가지 않도록)
      btn.textContent = '정말 보낼까요? 한 번 더'; btn.classList.add('armed');
      sendArmed = setTimeout(() => { sendArmed = null; btn.textContent = '작성 완료 · 전체 알림'; btn.classList.remove('armed'); }, 3000);
      return;
    }
    clearTimeout(sendArmed); sendArmed = null; btn.textContent = '보내는 중…'; btn.classList.remove('armed'); btn.disabled = true;
    try {
      await Promise.all([...chains.values()]);   // 아직 저장 중인 줄이 있으면 끝난 뒤 보냄
      const count = rows.filter((r) => has(r) && blockOfRow(r)).length;
      await api('/api/gear/notify?event=' + eventId, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ screen: SCREEN, name: $('who').value, count, test: qp0.get('ntest') === '1' || undefined, hide: qp0.get('nhide') === '1' || undefined }) });
      msg.style.color = '#1f7a3d'; msg.style.fontWeight = '700';
      msg.textContent = '✅ 알림 보냄 · ' + new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' }) + ' (일정 페이지 댓글에서 확인)';
    } catch (e) { msg.textContent = '⚠️ 알림 실패: ' + e.message + ' (알림이 가지 않았습니다)'; msg.style.color = '#b42318'; msg.style.fontWeight = '700'; return; }
    finally { btn.textContent = '작성 완료 · 전체 알림'; btn.disabled = false; }
  });
  init();
})();
</script>
</body>
</html>
