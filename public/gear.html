<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>음향장비 반출목록</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#15243b;background:#f4f7fb;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;padding:12px 12px 40px}
h1{font-size:clamp(18px,4vw,24px);margin:0}
button,select,input{font:inherit;color:inherit}
button{background:#fff;border:1px solid #ccd5e0;border-radius:8px;padding:7px 11px;cursor:pointer;touch-action:manipulation}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
#event{flex:1 1 200px;min-width:0;padding:8px;border:1px solid #ccd5e0;border-radius:8px;background:#fff;font-weight:700}
#status{font-size:12px;color:#5e6a7e;min-height:18px;margin:2px 0 8px}
#status.err{color:#b42318;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.blk{background:#fff;border:1.5px solid #9aa7b8;border-radius:8px;overflow:hidden}
.blk h2{margin:0;font-size:14px;padding:7px 9px;background:#e8edf4;border-bottom:1px solid #9aa7b8;display:flex;justify-content:space-between;align-items:center;gap:6px}
.blk h2 small{font-weight:600;color:#5e6a7e;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th{font-size:11px;color:#5e6a7e;font-weight:600;padding:4px 5px;border-bottom:1px solid #dfe5ec;text-align:left}
td{padding:3px 5px;border-bottom:1px solid #eef1f5;vertical-align:middle}
th.q,td.q{width:58px;text-align:center}
th.c,td.c{width:40px;text-align:center}
th.n,td.n{width:28%}
td.name{word-break:break-all;font-weight:600}
input.qty{width:100%;text-align:center;padding:5px 2px;border:1px solid #e3c96a;border-radius:6px;background:#fff8d6;font-weight:700}
input.qty.has{background:#ffe680;border-color:#c9a400}
input.note,input.kind{width:100%;padding:5px;border:1px solid #dfe5ec;border-radius:6px;background:#fff;font-size:12px}
input.kind{font-weight:600;font-size:13px}
input[type=checkbox]{width:20px;height:20px;accent-color:#1f7a3d}
tr.saving td{opacity:.55}
tr.failed td{background:#fde2e1}
tr.zero td.name{color:#8a95a5;font-weight:500}
.add{width:100%;border:0;border-top:1px dashed #ccd5e0;border-radius:0;color:#2156a5;font-weight:700;background:#fafcff}
.sum{font-size:12px;color:#5e6a7e;margin-left:auto}
.empty{display:none}
/* 휴대폰: 입력칸 글자 16px(아이폰 확대 방지), 위쪽 고정 막대, 칸 접기 */
.top.bar{position:sticky;top:0;z-index:5;background:#f4f7fb;padding:6px 0}
#ttl{flex:1 0 100%}
#evname{flex:1 1 150px;min-width:0;font-size:16px;line-height:1.3}
#evname[hidden],#ttl[hidden]{display:none}
.bar .sum{margin-left:0;white-space:nowrap}
.blk h2{cursor:pointer;user-select:none}
.blk h2 .cnt{margin-left:auto;font-size:12px;color:#1f7a3d;font-weight:700}
.blk h2 .arr{font-size:11px;color:#5e6a7e;transition:transform .15s}
.blk.fold h2 .arr{transform:rotate(-90deg)}
.blk.fold table,.blk.fold .add{display:none}
@media (max-width:640px){
  body{padding:8px 8px 60px}
  input.qty,input.note,input.kind,#event{font-size:16px}
  input.qty{padding:8px 2px}
  input[type=checkbox]{width:26px;height:26px}
  th.q,td.q{width:64px} th.c,td.c{width:44px} th.n,td.n{width:30%}
  td{padding:4px}
  .blk h2{font-size:15px;padding:11px 10px}
  .add{padding:12px}
  button{padding:9px 12px}
  .bar button{padding:7px 9px;font-size:14px}
  #evname{font-size:15px}
}
/* LED처럼 EA·BOX 두 칸인 칸: 이름칸을 넓게 */
.blk.box th.n,.blk.box td.n{width:18%}
.blk.box th.q,.blk.box td.q{width:52px}
/* 영상: 스크린 사이즈 1~4번 */
.scr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:2px 0 6px}
.scr[hidden]{display:none}
.scr label{display:flex;align-items:center;gap:4px;background:#fff;border:1.5px solid #9aa7b8;border-radius:8px;padding:4px 6px;font-size:12px;font-weight:700;color:#5e6a7e;white-space:nowrap}
.scr input{flex:1;min-width:0;border:0;padding:4px 2px;font-size:14px;font-weight:700;background:transparent}
.scr .saving{opacity:.55} .scr .failed{background:#fde2e1}
/* 영상: 영상담당자 (이름 버튼, 여러 명 선택) */
.vstaff{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:2px 0 6px;background:#fff;border:1.5px solid #9aa7b8;border-radius:8px;padding:6px 8px}
.vstaff[hidden]{display:none}
.vstaff b{font-size:12px;color:#5e6a7e;white-space:nowrap;margin-right:2px}
.vstaff button{flex:1 1 0;min-width:0;padding:7px 4px;border:1.5px solid #c7d2e0;border-radius:999px;background:#fff;font-weight:700;font-size:14px;color:#3b4a60}
.vstaff button.on{background:#2156a5;border-color:#2156a5;color:#fff}
.vstaff.saving{opacity:.6} .vstaff.failed{background:#fde2e1}
@media (max-width:640px){.vstaff b{flex:1 0 100%}.vstaff button{font-size:15px;padding:9px 4px}}
@media (max-width:640px){.scr{grid-template-columns:repeat(2,minmax(0,1fr))}.scr input{font-size:16px}}
/* 작성 완료 알림 */
.notify{margin:14px 0 4px;background:#fff;border:1.5px solid #1f7a3d;border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.notify b{flex:1 0 100%;font-size:14px;color:#1f7a3d}
.notify select{flex:1 1 140px;min-width:0;padding:9px;border:1px solid #ccd5e0;border-radius:8px;background:#fff;font-size:16px}
.notify button{flex:1 1 180px;background:#1f7a3d;border-color:#1f7a3d;color:#fff;font-weight:700;padding:11px}
.notify button.armed{background:#c9a400;border-color:#c9a400}
.notify small{flex:1 0 100%;font-size:12px;color:#5e6a7e}
@media print{
  .blk.fold table{display:table!important}
  body{background:#fff;padding:0}
  .noprint,.add,#status{display:none!important}
  .grid{grid-template-columns:repeat(4,1fr);gap:6px}
  .blk{break-inside:avoid;border-width:1px}
  tr.zero{display:none}
  input{border:0!important;background:none!important;padding:0!important}
  .blk.empty-print{display:none}
}
</style>
</head>
<body>
<div class="top bar">
  <h1 id="ttl">📦 음향장비 반출목록</h1>
  <select id="event" aria-label="일정 선택"><option>불러오는 중…</option></select>
  <b id="evname" hidden></b>
  <span class="sum" id="sum"></span>
  <button id="reload" class="noprint" title="다른 사람이 바꾼 내용 다시 불러오기">새로고침</button>
  <button id="print" class="noprint">인쇄</button>
  <button id="reset" class="noprint" style="color:#b42318;border-color:#f0b4ae">초기화</button>
</div>
<div id="vstaff" class="vstaff" hidden></div>
<div id="scr" class="scr" hidden></div>
<div id="status"></div>
<div class="grid" id="grid"></div>
<div class="notify noprint" id="notify" hidden>
  <b>✅ 다 적었으면 직원 모두에게 알려 주세요</b>
  <select id="who" aria-label="작성자"><option value="">작성자 선택</option></select>
  <button id="send">작성 완료 · 전체 알림</button>
  <small id="nmsg">누르면 이 일정 페이지에 댓글이 달리고, 직원들 노션 앱으로 알림이 갑니다.</small>
</div>
<datalist id="dl"></datalist>

    v32a: A_ORDER.a32,
  };
  const LAYOUT = VIDEO ? V_LAYOUT : A_LAYOUT, ORDER = VIDEO ? V_ORDER : A_ORDER;
  const OPEN = VIDEO ? 'vled' : 'main', TITLE = VIDEO ? '영상장비 반출목록' : '음향장비 반출목록';
  document.title = TITLE; $('ttl').textContent = (VIDEO ? '🎬 ' : '📦 ') + TITLE;
  const has = (r) => r.qty > 0 || r.box > 0;
  for (const col of LAYOUT) for (const b of col) if (ORDER[b.k]) b.order = (g) => { const i = ORDER[b.k].indexOf(g.name); return i < 0 ? 999 : i; };
  const BLOCKS = LAYOUT.flat();
  const blockOfCat = {}; BLOCKS.forEach((b) => b.cats.forEach((c) => { blockOfCat[c] = b; }));

  let catalog = [], byId = {}, events = [], eventId = null, rows = [];   // rows: 화면의 모든 줄 상태
  let seq = 0;
  const folded = {};
  const isPhone = () => window.matchMedia('(max-width:640px)').matches;

  const status = (msg, err) => { const s = $('status'); s.textContent = msg || ''; s.className = err ? 'err' : ''; };

  async function api(path, opt) {
    const r = await fetch(path, opt);
    let d = null; try { d = await r.json(); } catch {}
    if (!r.ok) throw new Error((d && d.error) || '서버 오류 (' + r.status + ')');
    return d;
  }

  const fmtDate = (s) => { const [y, m, d] = s.split('-').map(Number); const w = '일월화수목금토'[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; return `${m}/${d}(${w})`; };

  async function init() {
    status('불러오는 중…');
    try {
      const d = await api('/api/gear/init');
      catalog = d.catalog; byId = Object.fromEntries(catalog.map((g) => [g.id, g]));
      events = d.events;
      const sel = $('event'); sel.textContent = '';
      sel.append(new Option('— 일정을 고르세요 —', ''));
      const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
      let firstUpcoming = null;
      for (const e of events) {
        const label = `${fmtDate(e.startDate)}${e.endDate !== e.startDate ? '~' + fmtDate(e.endDate) : ''}  ${e.title}${e.category ? ' · ' + e.category : ''}`;
        sel.append(new Option(label, e.id));
        if (!firstUpcoming && e.endDate >= today) firstUpcoming = e.id;
      }
      const want = (new URLSearchParams(location.search).get('event') || '').replace(/-/g, '').toLowerCase();
      if (want && events.some((e) => e.id === want)) {
        // 일정 페이지 안에 붙인 화면: 행사가 정해져 있으므로 선택칸 대신 행사 이름만 표시
        sel.value = want; sel.hidden = true; $('ttl').hidden = true;
        const ev = events.find((e) => e.id === want);
        $('evname').textContent = `${VIDEO ? '🎬' : '📦'} ${fmtDate(ev.startDate)}${ev.endDate !== ev.startDate ? '~' + fmtDate(ev.endDate) : ''} ${ev.title}`;
        $('evname').hidden = false;
      }
      if (sel.value) await openEvent(sel.value); else { status('위에서 일정을 고르면 그 일정의 준비목록이 열립니다.'); render(); }
    } catch (e) { status(e.message, true); }
  }

  async function openEvent(id) {
    eventId = id || null; rows = []; for (const k in folded) delete folded[k];
    try { const u = new URL(location.href); if (id) u.searchParams.set('event', id); else u.searchParams.delete('event'); history.replaceState(null, '', u); } catch {}
    if (!id) { render(); status('일정을 고르세요.'); return; }
    status('목록 불러오는 중…');
    try {
      const d = await api('/api/gear?event=' + id);
      if (eventId !== id) return;
      rows = d.rows.map((r) => ({ ...r, key: ++seq }));
      render();
      status('입력하면 바로 노션에 저장됩니다. 수량을 0으로 지우면 그 줄은 빠집니다.');
    } catch (e) { status(e.message, true); }
  }

  const SCREEN = VIDEO ? '영상' : '음향';
  function blockOfRow(r) {
    if (r.pid && (r.screen || '음향') !== SCREEN) return null;   // 다른 화면에서 넣은 줄
    if (r.gear) { const g = byId[r.gear]; return g ? blockOfCat[g.cat] : null; }
    if (!r.block) return VIDEO ? null : BLOCKS.find((b) => b.k === 'etc');
    return BLOCKS.find((b) => b.k === r.block) || null;
  }

  // ── 저장 (줄마다 순서대로, 입력이 멈추면 0.6초 뒤) ──
  const timers = new Map(), chains = new Map();
  function queueSave(r, tr) {
    clearTimeout(timers.get(r.key));
    timers.set(r.key, setTimeout(() => {
      const prev = chains.get(r.key) || Promise.resolve();
      const job = prev.then(() => doSave(r, tr));
      chains.set(r.key, job.catch(() => {}));
    }, 600));
  }
  async function doSave(r, tr) {
    tr.classList.add('saving'); tr.classList.remove('failed');
    try {
      const body = { screen: SCREEN, pid: r.pid || undefined, gear: r.gear || undefined, block: r.block, text: r.text, qty: r.qty, box: r.box || 0, checked: r.checked, note: r.note };
      const d = await api('/api/gear?event=' + eventId, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      r.pid = d.row ? d.row.pid : null; r.screen = SCREEN;
      status('저장됨 · ' + new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' }));
    } catch (e) { tr.classList.add('failed'); status('저장 실패: ' + e.message + ' (다시 입력하면 재시도)', true); }
    finally { tr.classList.remove('saving'); updateSum(); }
  }

  function rowEl(r, b, fixedRow) {
    const tr = el('tr');
    const tdN = el('td', 'name');
    if (fixedRow) tdN.textContent = byId[r.gear] ? byId[r.gear].name : r.text;
    else {
      const inp = el('input', 'kind'); inp.value = r.gear ? (byId[r.gear] || {}).name || '' : r.text;
      inp.placeholder = '종류'; inp.setAttribute('list', 'dl');
      inp.addEventListener('focus', () => fillList(b));
      inp.addEventListener('change', () => {
        const v = inp.value.trim();
        const g = catalog.find((x) => b.cats.includes(x.cat) && !(b.skip || []).includes(x.name) && (x.name === v || x.full === v));
        if (g) { r.gear = g.id; r.text = ''; inp.value = g.name; } else { r.gear = null; r.text = v; r.block = b.k; }
        if (!r.qty && v) qty.focus();   // 수량은 비워 두고 바로 수량칸으로 이동
        queueSave(r, tr); paint();
      });
      tdN.append(inp);
    }
    const qty = el('input', 'qty'); qty.type = 'number'; qty.inputMode = 'numeric'; qty.min = 0; qty.value = r.qty || '';
    qty.addEventListener('input', () => { r.qty = Math.max(0, parseInt(qty.value, 10) || 0); paint(); queueSave(r, tr); });
    const chk = el('input'); chk.type = 'checkbox'; chk.checked = !!r.checked; chk.title = '챙김';
    chk.addEventListener('change', () => { r.checked = chk.checked; queueSave(r, tr); });
    const note = el('input', 'note'); note.value = r.note || ''; note.placeholder = '';
    note.addEventListener('input', () => { r.note = note.value; queueSave(r, tr); });
    const tq = el('td', 'q'); tq.append(qty);
    let tb2 = null, boxIn = null;
    if (b.box) {
      boxIn = el('input', 'qty'); boxIn.type = 'number'; boxIn.inputMode = 'numeric'; boxIn.min = 0; boxIn.value = r.box || '';
      boxIn.addEventListener('input', () => { r.box = Math.max(0, parseInt(boxIn.value, 10) || 0); paint(); queueSave(r, tr); });
      tb2 = el('td', 'q'); tb2.append(boxIn);
    }
    const tc = el('td', 'c'); tc.append(chk);
    const tn = el('td', 'n'); tn.append(note);
    tr.append(...[tdN, tq, tb2, tc, tn].filter(Boolean));
    function paint() { qty.classList.toggle('has', r.qty > 0); if (boxIn) boxIn.classList.toggle('has', r.box > 0); tr.classList.toggle('zero', !has(r)); }
    paint();
    return tr;
  }

  function fillList(b) {
    const dl = $('dl'); dl.textContent = '';
    let list = catalog.filter((g) => b.cats.includes(g.cat) && !(b.skip || []).includes(g.name));
    if (b.order) list = list.map((g, i) => [g, i]).sort((x, y) => (b.order(x[0]) - b.order(y[0])) || (x[1] - y[1])).map((x) => x[0]);
    for (const g of list) dl.append(new Option(g.name));
  }

  // 영상: 행사명 아래 스크린 사이즈 1~4번 (노션에는 [vscr] 1~4 줄의 NOTE로 저장)
  function renderScreens() {
    const box = $('scr'); box.textContent = '';
    box.hidden = !VIDEO || !eventId;
    if (box.hidden) return;
    for (const n of ['1', '2', '3', '4']) {
      let r = rows.find((x) => !x.gear && x.block === 'vscr' && x.text === n);
      if (!r) { r = { key: ++seq, gear: null, block: 'vscr', text: n, qty: 0, checked: false, note: '' }; rows.push(r); }
      const lab = el('label'); lab.append(n + '번 스크린');
      const inp = el('input'); inp.value = r.note || ''; inp.placeholder = '사이즈';
      inp.addEventListener('input', () => { r.note = inp.value; queueSave(r, lab); });
      lab.append(inp); box.append(lab);
    }
  }

  // 영상: 영상담당자 (노션에는 [vstaff] 담당자 줄의 NOTE에 "이름, 이름"으로 저장)
  const V_STAFF = ['안준용', '정덕수', '김상연', '이영범'];
  function renderStaff() {
    const box = $('vstaff'); box.textContent = '';
    box.hidden = !VIDEO || !eventId;
    if (box.hidden) return;
    let r = rows.find((x) => !x.gear && x.block === 'vstaff');
    if (!r) { r = { key: ++seq, gear: null, block: 'vstaff', text: '담당자', qty: 0, checked: false, note: '' }; rows.push(r); }
    const picked = new Set((r.note || '').split(',').map((x) => x.trim()).filter(Boolean));
    box.append(el('b', null, '🎬 영상담당자'));
    for (const n of V_STAFF) {
      const b = el('button', picked.has(n) ? 'on' : null, n); b.type = 'button';
      b.addEventListener('click', () => {
        if (picked.has(n)) picked.delete(n); else picked.add(n);
        b.classList.toggle('on', picked.has(n));
        r.note = V_STAFF.filter((x) => picked.has(x)).join(', ');
        queueSave(r, box);
      });
      box.append(b);
    }
  }

  function render() {
    renderStaff();
    renderScreens();
    const grid = $('grid'); grid.textContent = '';
    for (const col of LAYOUT) {
      const c = el('div', 'col');
      for (const b of col) {
        const box = el('section', 'blk');
        const h = el('h2'); h.append(el('span', null, b.t), el('span', 'cnt'), el('span', 'arr', '▼')); box.append(h);
        h.addEventListener('click', () => { box.classList.toggle('fold'); folded[b.k] = box.classList.contains('fold'); });
        box.dataset.k = b.k; if (b.box) box.classList.add('box');
        const tbl = el('table');
        const hr = el('tr'); (b.box ? [['종류', ''], ['EA', 'q'], ['BOX', 'q'], ['챙김', 'c'], ['NOTE', 'n']] : [['종류', ''], ['수량', 'q'], ['챙김', 'c'], ['NOTE', 'n']]).forEach(([t, k]) => hr.append(el('th', k, t)));
        const thead = el('thead'); thead.append(hr);
        const tb = el('tbody'); tbl.append(thead, tb); box.append(tbl);
        let mine = rows.filter((r) => blockOfRow(r) === b);
        if (b.fixed) {
          let list = catalog.filter((g) => b.cats.includes(g.cat) && !(b.skip || []).includes(g.name));
          if (b.order) list = list.map((g, i) => [g, i]).sort((x, y) => (b.order(x[0]) - b.order(y[0])) || (x[1] - y[1])).map((x) => x[0]);
          for (const g of list) {
            let r = mine.find((x) => x.gear === g.id);
            if (!r) { r = { key: ++seq, gear: g.id, qty: 0, checked: false, note: '' }; rows.push(r); }
            tb.append(rowEl(r, b, true));
          }
          for (const r of mine.filter((x) => !list.some((g) => g.id === x.gear))) tb.append(rowEl(r, b, false));
        }
        if (!b.fixed) for (const r of mine) tb.append(rowEl(r, b, false));
        if (!b.fixed || b.add) {
          const add = el('button', 'add', '+ 추가');
          add.disabled = !eventId;
          add.addEventListener('click', () => {
            const r = { key: ++seq, gear: null, block: b.k, text: '', qty: 0, checked: false, note: '' }; rows.push(r);
            const tr = rowEl(r, b, false); tb.append(tr); tr.querySelector('input').focus();
          });
          box.append(add);
        }
        if (!eventId) box.querySelectorAll('input').forEach((i) => { i.disabled = true; });
        // 휴대폰에서는 아직 넣은 게 없는 고정 칸(XLR·전원선 등 긴 목록)을 접어 둠. 머리글을 누르면 펼침
        const fold = b.k in folded ? folded[b.k] : b.k !== OPEN;   // 처음엔 첫 칸(음향: MAIN SPEAKER + AMP, 영상: LED)만 펼침
        box.classList.toggle('fold', !!fold);
        c.append(box);
      }
      grid.append(c);
    }
    updateSum();
  }

  function updateSum() {
    const used = rows.filter((r) => has(r) && blockOfRow(r));   // 이 화면(음향/영상) 칸에 속한 줄만
    document.querySelectorAll('.blk').forEach((box) => {
      const b = BLOCKS.find((x) => x.k === box.dataset.k);
      const n = used.filter((r) => blockOfRow(r) === b).length;
      box.querySelector('.cnt').textContent = n ? n + '종' : '';
    });
    const done = used.filter((r) => r.checked).length;
    $('sum').textContent = eventId && used.length ? `챙김 ${done} / ${used.length}종` : '';
    const ev = events.find((e) => e.id === eventId);
    document.title = ev ? `${TITLE} · ${ev.title}` : TITLE;
  }

  $('event').addEventListener('change', (e) => openEvent(e.target.value));
  $('reload').addEventListener('click', () => eventId && openEvent(eventId));
  $('print').addEventListener('click', () => window.print());
  // 초기화: 한 번 누르면 확인 문구로 바뀌고, 3초 안에 한 번 더 눌러야 실행 (노션 앱 안에서는 확인 창이 막힐 수 있어 버튼으로 확인)
  let resetArmed = null;
  $('reset').addEventListener('click', async () => {
    const btn = $('reset');
    if (!eventId) return;
    if (!resetArmed) {
      btn.textContent = '정말 지울까요? 한 번 더'; btn.style.background = '#fde2e1';
      resetArmed = setTimeout(() => { resetArmed = null; btn.textContent = '초기화'; btn.style.background = ''; }, 3000);
      return;
    }
    clearTimeout(resetArmed); resetArmed = null; btn.textContent = '초기화'; btn.style.background = ''; btn.disabled = true;
    // 화면은 바로 비우고, 노션 삭제는 뒤에서 진행
    for (const t of timers.values()) clearTimeout(t);
    timers.clear();
    const pending = [...chains.values()];
    const id = eventId;
    const pids = rows.filter((r) => r.pid && blockOfRow(r)).map((r) => r.pid);   // 이 화면 칸의 줄만 (음향↔영상 서로 안 지움)
    rows = []; render(); status('초기화했습니다 · 노션에서 지우는 중…');
    try {
      await Promise.all(pending);
      const d = await api('/api/gear/reset?event=' + id, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pids }) });
      if (eventId === id) status(`초기화 완료 (${d.removed}줄 · 노션 휴지통에서 되살릴 수 있음)`);
    } catch (e) { status('초기화 일부 실패: ' + e.message + ' (새로고침하면 남은 줄이 보입니다)', true); }
    finally { btn.disabled = false; }
  });
  // ── 작성 완료 알림 ──
  (async () => {
    try {
      const d = await api('/api/gear/staff');
      const who = $('who');
      for (const n of d.names) who.append(new Option(n, n));
      try { const saved = localStorage.getItem('gearWho'); if (saved && d.names.includes(saved)) who.value = saved; } catch {}
      who.addEventListener('change', () => { try { localStorage.setItem('gearWho', who.value); } catch {} });
    } catch {}
  })();
  const showNotify = () => { $('notify').hidden = !eventId; };
  setInterval(showNotify, 1000);
  let sendArmed = null;
  $('send').addEventListener('click', async () => {
    const btn = $('send'), msg = $('nmsg');
    if (!eventId) return;
    if (!$('who').value) { msg.textContent = '먼저 작성자를 고르세요.'; $('who').focus(); return; }
    if (!sendArmed) {   // 두 번 눌러야 보냄 (실수로 전 직원에게 알림이 가지 않도록)
      btn.textContent = '정말 보낼까요? 한 번 더'; btn.classList.add('armed');
      sendArmed = setTimeout(() => { sendArmed = null; btn.textContent = '작성 완료 · 전체 알림'; btn.classList.remove('armed'); }, 3000);
      return;
    }
    clearTimeout(sendArmed); sendArmed = null; btn.textContent = '보내는 중…'; btn.classList.remove('armed'); btn.disabled = true;
    try {
      await Promise.all([...chains.values()]);   // 아직 저장 중인 줄이 있으면 끝난 뒤 보냄
      const count = rows.filter((r) => has(r) && blockOfRow(r)).length;
      await api('/api/gear/notify?event=' + eventId, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ screen: SCREEN, name: $('who').value, count }) });
      msg.style.color = '#1f7a3d'; msg.style.fontWeight = '700';
      msg.textContent = '✅ 알림 보냄 · ' + new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' }) + ' (일정 페이지 댓글에서 확인)';
    } catch (e) { msg.textContent = '⚠️ 알림 실패: ' + e.message + ' (알림이 가지 않았습니다)'; msg.style.color = '#b42318'; msg.style.fontWeight = '700'; return; }
    finally { btn.textContent = '작성 완료 · 전체 알림'; btn.disabled = false; }
  });
  init();
})();
</script>
</body>
</html>
